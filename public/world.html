<style>
:root {
  --panel: rgba(255, 255, 255, .88); --line: rgba(20, 24, 36, .12); --text: #1b1f2a; --muted: #5d6475;
  --accent: #1f9d74; --sky: #bfe3f7; --shadow: 0 6px 24px rgba(15, 20, 30, .16);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --panel: rgba(21, 25, 32, .86); --line: rgba(255, 255, 255, .1); --text: #e7e9ef; --muted: #a0a7b7;

  }
}

  --panel: rgba(21, 25, 32, .86); --line: rgba(255, 255, 255, .1); --text: #e7e9ef; --muted: #a0a7b7;

}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--sky); color: var(--text);
  font: 14px/1.45 "Pretendard Variable", Pretendard, system-ui, sans-serif; }
:root:lang(ja) body { font-family: "Pretendard Variable", Pretendard, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", Meiryo, "Noto Sans JP", system-ui, sans-serif; }
#scene { position: fixed; inset: 0; }

  border-radius: 9px; padding: 4px 10px; text-decoration: none; cursor: pointer; }

}

<!-- Labels first, so they are translated while three.js is still loading from the CDN. -->
<script type="module">

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { t, lang, locale } from './i18n.js';
import { setPersonaMembers, memberName, memberColor, memberAccentColor, avatarSpec, createAvatar, loadAvatarImage, drawAvatar } from './persona-client.js';
import { drawMaterial, materialSize, isFurniture, furnitureBatch, furnitureGeometry, FACING_TURN } from './world-materials.js';
import { HOME_CAMERAS, homeVisible, buriedCube, NEIGHBORS, safeRoute } from './world-home.js';
import { createDiorama } from './world-diorama.js';
import { createLivingView } from './living-view.js';
import { appUrl } from './base-path.js';

let MEMBERS = {};
let USER_NAME = ''; // the owner's name from /api/state
const NAME_OF = (id) => id === 'user' ? USER_NAME || t('user.default') : memberName(id);
// Canvas text (signs, name tags, speech bubbles): Japanese fonts ahead of the system font in a Japanese room.
const FONT_STACK = lang === 'ja'
  ? '"Pretendard Variable", Pretendard, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", Meiryo, "Noto Sans JP", system-ui, sans-serif'
  : '"Pretendard Variable", Pretendard, system-ui, sans-serif';
const $ = (s) => document.querySelector(s);
let pendingFrame = null, needsRender = true, lastFrameAt = 0, lastTickAt = 0, renderedFrames = 0;
let HOME = null, cutaway = true, cameraPreset = 'overview', loadedOnce = false;
let diorama = null, dioramaDirty = true;
const frameTimes = [];

// ---------- scene ----------
const box = $('#scene');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.25));
box.append(renderer.domElement);
const scene = new THREE.Scene();
const livingView = createLivingView({ THREE, scene, root: $('#living-view'), invalidate, memberName: NAME_OF });
if (matchMedia('(max-width: 760px)').matches) $('#living-panel').open = false;
// Track toolbar wrapping without introducing a frame loop or covering chat controls.
const livingLayout = new ResizeObserver(() => {
  document.documentElement.style.setProperty('--world-toolbar-bottom', `${Math.ceil($('.top').getBoundingClientRect().bottom) + 8}px`);
});
livingLayout.observe($('.top'));
const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 500);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.49;
controls.autoRotateSpeed = 0.6;
const hemi = new THREE.HemisphereLight(0xffffff, 0x6b7a5c, 1.0);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 0.9);
sun.position.set(30, 60, 20);
scene.add(sun);

// A single render pass, shared materials and no realtime shadow maps.
controls.addEventListener('change', invalidate);
controls.addEventListener('start', invalidate);

// ---------- lamp light (GLSL) ----------
// Every lit material gets the nearest lamps as point lights through onBeforeCompile:
// warm light with a smooth falloff, no shadows (it goes through walls, like a glow).
const MAX_LAMPS = 12;
const LAMP = {
  uLamps: { value: Array.from({ length: MAX_LAMPS }, () => new THREE.Vector3()) },
  uLampCount: { value: 0 },
  uLampColor: { value: new THREE.Color(1.0, 0.74, 0.42) },
  uLampStrength: { value: 0.7 },
  uTime: { value: 0 },
  uGlow: { value: 3.2 },
};
let lampCenters = [];
let lampDirty = true;

function lampLit(mat) {
  mat.onBeforeCompile = (sh) => {
    Object.assign(sh.uniforms, { uLamps: LAMP.uLamps, uLampCount: LAMP.uLampCount, uLampColor: LAMP.uLampColor, uLampStrength: LAMP.uLampStrength });
    sh.vertexShader = 'varying vec3 vLampPos;\nvarying vec3 vLampNrm;\n' + sh.vertexShader.replace('#include <project_vertex>', `#include <project_vertex>
      {
        vec4 lp = vec4(transformed, 1.0);
        vec3 ln = objectNormal;
        #ifdef USE_INSTANCING
          lp = instanceMatrix * lp;
          ln = mat3(instanceMatrix) * ln;
        #endif
        vLampPos = (modelMatrix * lp).xyz;
        vLampNrm = normalize(mat3(modelMatrix) * ln);
      }`);
    sh.fragmentShader = `#define MAX_LAMPS ${MAX_LAMPS}
      uniform vec3 uLamps[MAX_LAMPS];
      uniform int uLampCount;
      uniform vec3 uLampColor;
      uniform float uLampStrength;
      varying vec3 vLampPos;
      varying vec3 vLampNrm;
      vec3 lampLight() {
        vec3 sum = vec3(0.0);
        vec3 n = normalize(vLampNrm);
        for (int i = 0; i < MAX_LAMPS; i++) {
          if (i >= uLampCount) break;
          vec3 d = uLamps[i] - vLampPos;
          float dist = length(d);
          float fall = clamp(1.0 - dist / 9.0, 0.0, 1.0);
          fall *= fall;
          float facing = max(dot(n, d / max(dist, 1e-3)), 0.0);
          sum += uLampColor * fall * (0.25 + 0.75 * facing);
        }
        return sum * uLampStrength;
      }
      ${sh.fragmentShader.replace('#include <opaque_fragment>', 'outgoingLight += diffuseColor.rgb * lampLight();\n#include <opaque_fragment>')}`;
  };
  mat.customProgramCacheKey = () => 'lamp-lit';
  return mat;
}

// The lamp block itself: a dark metal frame and a warm core in a 4x4 grid of cells that
// breathe at slightly different rates. HDR output so the bloom pass picks it up.
function lampMaterial() {
  return new THREE.ShaderMaterial({
    uniforms: { uTime: LAMP.uTime, uGlow: LAMP.uGlow },
    vertexShader: `
      varying vec2 vUv;
      varying float vSeed;
      void main() {
        vUv = uv;
        vec4 p = vec4(position, 1.0);
        vSeed = 0.0;
        #ifdef USE_INSTANCING
          p = instanceMatrix * p;
          vSeed = fract(sin(dot(instanceMatrix[3].xyz, vec3(12.9898, 78.233, 37.719))) * 43758.5453);
        #endif
        gl_Position = projectionMatrix * modelViewMatrix * p;
      }`,
    fragmentShader: `
      uniform float uTime;
      uniform float uGlow;
      varying vec2 vUv;
      varying float vSeed;
      float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
      void main() {
        float edge = min(min(vUv.x, 1.0 - vUv.x), min(vUv.y, 1.0 - vUv.y));
        float frame = smoothstep(0.05, 0.1, edge);
        vec2 cell = floor(vUv * 4.0);
        vec2 inCell = fract(vUv * 4.0) - 0.5;
        float h = hash(cell + vSeed * 17.0);
        float breathe = 0.82 + 0.18 * sin(uTime * (1.2 + h * 1.8) + h * 6.2832);
        float core = 1.0 - smoothstep(0.0, 0.72, length(vUv - 0.5) * 1.35);
        float seams = smoothstep(0.5, 0.42, max(abs(inCell.x), abs(inCell.y)));
        vec3 warm = mix(vec3(1.0, 0.64, 0.26), vec3(1.0, 0.86, 0.56), core);
        vec3 inner = warm * (0.75 + 0.45 * h) * breathe * (0.9 + 0.45 * core) * mix(0.7, 1.0, seams) * uGlow;
        vec3 metal = vec3(0.30, 0.23, 0.15);
        gl_FragColor = vec4(mix(metal, inner, frame), 1.0);
      }`,
  });
}

function updateLamps(force = false) {
  if (!force && !lampDirty && performance.now() - (updateLamps.at || 0) < 500) return;
  updateLamps.at = performance.now();
  lampDirty = false;
  let list = lampCenters;
  if (list.length > MAX_LAMPS) {
    const target = controls.target;
    list = [...list].sort((a, b) => a.distanceToSquared(target) - b.distanceToSquared(target)).slice(0, MAX_LAMPS);
  }
  list.forEach((v, i) => LAMP.uLamps.value[i].copy(v));
  LAMP.uLampCount.value = list.length;
}

// Screenshot mode: ?shot=1&night=0|1&view=iso|top&tx=&tz=&dist=&angle=  (the server's
// headless camera; it waits for window.__shotReady before capturing).
const Q = new URLSearchParams(location.search);
const SHOT = Q.get('shot') === '1';
if (SHOT) document.body.classList.add('shot');

// Day / night.
let night = false;
try { night = localStorage.getItem('world-night') === '1'; } catch { /* no storage */ }
if (Q.has('night')) night = Q.get('night') === '1';
function applyNight() {
  const livingHome = HOME?.id === 'mulgyeol-maru';
  hemi.intensity = night ? (livingHome ? 0.85 : 0.1) : livingHome ? 1.5 : 1.15;
  hemi.color.set(night ? 0xa5b9e0 : 0xfff9ed);
  hemi.groundColor.set(livingHome ? night ? 0x414b61 : 0xa9b2a0 : 0x6b7a5c);
  sun.intensity = night ? (livingHome ? 0.4 : 0.06) : livingHome ? 1.65 : 1.0;
  sun.position.set(livingHome ? -10 : 30, 60, livingHome ? 55 : 20);
  sun.color.set(night ? 0xe5c6a2 : 0xfff2d8);
  scene.background = new THREE.Color(night ? 0x192c3b : livingHome ? 0xdce8e4 : 0xbfe3f7);
  diorama?.setNight?.(night);
  // Kept low on purpose: many lamps side by side (e.g. behind glass) stack up quickly.
  LAMP.uLampStrength.value = night ? 1.0 : 0.35;
  LAMP.uGlow.value = night ? 2.3 : 1.9;
  if (gridLines) gridLines.material.opacity = night ? 0.1 : 0.35; // unlit lines glare at night
  document.documentElement.dataset.theme = night ? 'dark' : 'light';
  $('#night').classList.toggle('on', night);
  $('#night').textContent = t(night ? 'world.day' : 'world.night');
  invalidate();
}

let SIZE = { x: 48, y: 32, z: 48 };
let PALETTE = {};
const blocks = new Map(); // "x,y,z" -> name
const meshes = new Map(); // name -> InstancedMesh
const cube = new THREE.BoxGeometry(1, 1, 1);
let ground = null;
let gridLines = null;

function homeView() {
  if (HOME?.id === 'mulgyeol-maru') { selectCamera('overview'); return; }
  camera.position.set(SIZE.x * 0.5 + 34, 36, SIZE.z * 0.5 + 42);
  controls.target.set(SIZE.x / 2, 2, SIZE.z / 2);
  follow = null;
  controls.update();
  invalidate();
}

const homeLabels = {
  ko: { overview: '집 전체', living: '거실·주방', courtyard: '마당', album: '앨범 코너', inside: '실내 보기', outside: '지붕 보기' },
  en: { overview: 'Home', living: 'Living · Kitchen', courtyard: 'Courtyard', album: 'Album nook', inside: 'Interior', outside: 'Roof' },
  ja: { overview: '家全体', living: '居間・キッチン', courtyard: '中庭', album: 'アルバム', inside: '室内', outside: '屋根' },
};
function selectCamera(id) {
  const view = HOME_CAMERAS[id];
  if (!view) return;
  cameraPreset = id; follow = null; freeCam = false; controls.autoRotate = false;
  stopCameraInertia();
  $('#rotate').classList.remove('on');
  camera.near = 1; // retain depth precision for thin rugs at the mobile overview distance
  camera.fov = view.fov; camera.updateProjectionMatrix();
  camera.position.fromArray(view.position); controls.target.fromArray(view.target);
  camera.position.sub(controls.target).multiplyScalar(Math.max(1,1.1/camera.aspect)).add(controls.target);
  controls.update(); renderWhoState();
  for (const button of $('#cameras').children) button.classList.toggle('on', button.dataset.camera === id);
  if (id === 'album') refreshAlbum();
  invalidate();
}
function renderHomeControls() {
  const enabled = HOME?.id === 'mulgyeol-maru';
  const labels = homeLabels[lang] || homeLabels.ko;
  $('#cameras').hidden = !enabled; $('#cutaway').hidden = !enabled;
  $('#world-title').textContent = enabled ? HOME.title || '물결마루' : t('world.title');
  $('#cameras').replaceChildren();
  if (!enabled) return;
  for (const id of Object.keys(HOME_CAMERAS)) {
    const button = document.createElement('button'); button.type = 'button';
    button.textContent = labels[id]; button.dataset.camera = id;
    button.classList.toggle('on', cameraPreset === id); button.onclick = () => selectCamera(id);
    $('#cameras').append(button);
  }
  $('#cutaway').textContent = cutaway ? labels.outside : labels.inside;
  $('#cutaway').onclick = () => {
    cutaway = !cutaway;
    rebuild(new Set([...blocks.values(), ...meshes.keys()])); renderSigns(); renderHomeControls();
    invalidate();
  };
}

// Camera from the screenshot parameters.
// Free camera (cx, cy, cz = the cell to stand in): look at (lx, ly, lz), or turn by yaw
// (0 = north/-z, 90 = east/+x) and pitch (up +, down −), or take a quaternion (qx..qw).
// Orbit camera otherwise: look at (tx, tz) from `dist` away, `angle` degrees around it,
// `elev` degrees above the horizon ("top" looks almost straight down).
let freeCam = false;
const CUT = Number.isFinite(parseFloat(Q.get('cut'))) ? parseFloat(Q.get('cut')) : Infinity; // hide blocks above this y
function shotView() {
  const num = (k, d) => (Number.isFinite(parseFloat(Q.get(k))) ? parseFloat(Q.get(k)) : d);
  const deg = Math.PI / 180;
  if (Q.has('fov')) { camera.fov = Math.max(20, Math.min(110, num('fov', 50))); camera.updateProjectionMatrix(); }
  if (Q.has('cx') && Q.has('cy') && Q.has('cz')) {
    freeCam = true;
    const cellCenter = (x, y, z) => new THREE.Vector3(x + 0.5, y - 0.5, z + 0.5);
    camera.position.copy(cellCenter(num('cx', 0), num('cy', 1), num('cz', 0)));
    if (Q.has('qw')) {
      camera.quaternion.set(num('qx', 0), num('qy', 0), num('qz', 0), num('qw', 1)).normalize();
    } else if (Q.has('lx')) {
      camera.lookAt(cellCenter(num('lx', 0), num('ly', 1), num('lz', 0)));
    } else {
      const yaw = num('yaw', 0) * deg, pitch = num('pitch', 0) * deg;
      const dir = new THREE.Vector3(Math.sin(yaw) * Math.cos(pitch), Math.sin(pitch), -Math.cos(yaw) * Math.cos(pitch));
      camera.lookAt(camera.position.clone().add(dir));
    }
    return;
  }
  const top = Q.get('view') === 'top';
  const tx = num('tx', SIZE.x / 2), tz = num('tz', SIZE.z / 2);
  const dist = Math.max(4, Math.min(140, num('dist', top ? 62 : 64)));
  const angle = num('angle', 40) * deg;
  const pitch = Math.max(2, Math.min(89, num('elev', top ? 83 : 35.5))) * deg; // above the horizon
  controls.target.set(tx, 2, tz);
  camera.position.set(
    tx + Math.sin(angle) * Math.cos(pitch) * dist,
    2 + Math.sin(pitch) * dist,
    tz + Math.cos(angle) * Math.cos(pitch) * dist,
  );
  controls.update();
}

function buildGround() {
  if (ground) {
    scene.remove(ground);
    for (const part of ground.children) { part.geometry.dispose(); part.material.dispose(); }
  }
  ground = null; gridLines = null;
  if (HOME?.id === 'mulgyeol-maru') return;
  ground = new THREE.Group();
  const g = new THREE.BoxGeometry(SIZE.x, 1, SIZE.z);
  // Repeat through UVs so the shared grass texture needs no cloned texture.
  const uv = g.attributes.uv;
  for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * SIZE.x, uv.getY(i) * SIZE.z);

  ground.add(plane);
  const grid = new THREE.GridHelper(SIZE.x, SIZE.x, 0x3d7a33, 0x4f8f45);
  grid.position.set(SIZE.x / 2, 0.01, SIZE.z / 2);

  grid.material.opacity = night ? 0.1 : 0.35;

}

// ---------- block looks ----------
// Stored values: "name", "name/slab", "name/<stair|furniture>/<n|e|s|w>", "door/<x|z>".
const parseBlock = (v) => {
  const [type, shape, facing] = String(v).split('/');
  if (type === 'door') return { type, shape: 'door', facing: shape || '' };
  return { type, shape: shape || 'full', facing: facing || '' };

    tex = canvasTexture(size, size, (g) => drawMaterial(g, size, name, PALETTE[name] || (name === 'grass' ? '#5fa04e' : '#ff00ff')));

const matCache = new Map();

  if (c) {
    const map = texOf(type);

    // treats it like a lamp; dark or pink-ish colors need a bigger push than warm ones.
    if (c.glow) {
      // Aim for a luminance just over the bloom threshold, but never push one channel past
      // 4 (a pink block at 9x washed the whole night scene pink).
      const cols = Object.values(c.colors).map((h) => new THREE.Color(h));
      const mean = cols.reduce((a, k) => a + 0.299 * k.r + 0.587 * k.g + 0.114 * k.b, 0) / Math.max(1, cols.length);

function invalidateMaterials(names) {
  for (const n of names) {

    texCache.get(n)?.dispose(); texCache.delete(n);

// Geometry per shape, centred in the cell like the full cube.
const geoCache = new Map();
function geometryOf(shape, facing, type) {
  const k = `${shape}/${isFurniture(shape) ? '' : facing}/${type === 'bookshelf' ? 'shelf' : ''}`;
  if (geoCache.has(k)) return geoCache.get(k);
  let g;
  if (isFurniture(shape)) {
    g = furnitureGeometry(THREE, mergeGeometries, shape);
  } else if (shape === 'slab') {
    g = new THREE.BoxGeometry(1, 0.5, 1).translate(0, -0.25, 0);
  } else if (shape === 'stair') {
    // bottom half everywhere + top half on the facing side (n = toward smaller z)
    const low = new THREE.BoxGeometry(1, 0.5, 1).translate(0, -0.25, 0);
    const off = { n: [0, -0.25], s: [0, 0.25], e: [0.25, 0], w: [-0.25, 0] }[facing] || [0, -0.25];
    const high = (facing === 'e' || facing === 'w' ? new THREE.BoxGeometry(0.5, 0.5, 1) : new THREE.BoxGeometry(1, 0.5, 0.5)).translate(off[0], 0.25, off[1]);
    g = mergeGeometries([low, high], false);

  return g;
}

// A door with no facing leans against its neighbours: walls east/west → it spans x.
function doorFacing(x, y, z) {
  const solid = (a, b) => { const v = blocks.get(`${a},${y},${b}`); return v && parseBlock(v).type !== 'door'; };
  if (solid(x - 1, z) || solid(x + 1, z)) return 'x';
  if (solid(x, z - 1) || solid(x, z + 1)) return 'z';
  return 'x';
}
function renderKey(k, v) {
  const p = parseBlock(v);
  if (isFurniture(p.shape)) return furnitureBatch(p.type, p.shape);
  if (p.type !== 'door') return v;
  const [x, y, z] = k.split(',').map(Number);
  return `door/${p.facing || doorFacing(x, y, z)}`;
}

// Rebuild the instanced meshes for the stored values that changed (doors always, since
// they lean on their neighbours).
function rebuild(values) {
  livingView.setHome(HOME, blocks);
  if (HOME?.id === 'mulgyeol-maru') {
    for (const mesh of meshes.values()) { scene.remove(mesh); mesh.dispose(); }
    meshes.clear();
    if (dioramaDirty || !diorama) {
      if (diorama) { scene.remove(diorama.group); diorama.dispose(); }
      diorama = createDiorama({ THREE, home: HOME, blocks });
      scene.add(diorama.group); dioramaDirty = false;
    }
    diorama.setCutaway(cutaway);
    diorama.setNight?.(night);
    lampCenters = []; lampDirty = true;
    $('#count').textContent = ({ko:'바닷가 작은 집의 하루',en:'A day at the seaside home',ja:'海辺の小さな家の一日'}[lang] || '');
    $('#empty').hidden = true;
    invalidate();
    return;
  }
  if (diorama) { scene.remove(diorama.group); diorama.dispose(); diorama = null; dioramaDirty = true; }
  const want = new Set();
  let lampsChanged = false;
  for (const v of values) {
    const p = parseBlock(v);
    if (isGlow(p.type)) lampsChanged = true;
    if (p.type === 'door') { want.add('door/x'); want.add('door/z'); }
    else want.add(isFurniture(p.shape) ? furnitureBatch(p.type, p.shape) : v);
  }
  const groups = new Map();
  let hasDoor = false;
  for (const [k, v] of blocks) {
    const [x,y,z] = k.split(',').map(Number);
    const visible = (px,py,pz) => homeVisible(px,py,pz,HOME,cutaway,CUT);
    if (!visible(x,y,z) || buriedCube(x,y,z,v,blocks,CUSTOM,visible)) continue;
    const rk = renderKey(k, v);
    if (rk.startsWith('door/')) hasDoor = true;
    if (want.has(rk) || rk.startsWith('door/')) (groups.get(rk) || groups.set(rk, []).get(rk)).push(k);
  }
  if (hasDoor || want.has('door/x')) { want.add('door/x'); want.add('door/z'); }
  const m4 = new THREE.Matrix4();
  const tint = new THREE.Color();
  for (const rk of want) {
    const old = meshes.get(rk);
    if (old) { scene.remove(old); old.dispose(); }
    const keys = groups.get(rk) || [];
    if (!keys.length) { meshes.delete(rk); continue; }
    const p = parseBlock(rk);
    const mesh = new THREE.InstancedMesh(geometryOf(p.shape, p.facing, p.type), material(p.type), keys.length);
    keys.forEach((k, i) => {
      const [x, y, z] = k.split(',').map(Number);
      m4.makeRotationY(isFurniture(p.shape) ? FACING_TURN[parseBlock(blocks.get(k)).facing] || 0 : 0);
      m4.setPosition(x + 0.5, y - 0.5, z + 0.5);
      mesh.setMatrixAt(i, m4);
      const seed = (Math.imul(x + 1, 73856093) ^ Math.imul(y + 1, 19349663) ^ Math.imul(z + 1, 83492791)) >>> 0;
      const shade = isGlow(p.type) || CUSTOM[p.type] ? 1 : 0.96 + (seed % 1001) / 1000 * 0.08;
      mesh.setColorAt(i, tint.setRGB(shade, shade, shade));
    });
    mesh.instanceMatrix.needsUpdate = true;
    mesh.instanceColor.needsUpdate = true;
    scene.add(mesh);
    meshes.set(rk, mesh);
  }
  if (lampsChanged) {
    lampCenters = [];
    for (const [k, v] of blocks) {
      if (!isGlow(parseBlock(v).type)) continue;
      const [x, y, z] = k.split(',').map(Number);
      lampCenters.push(new THREE.Vector3(x + 0.5, y - 0.5, z + 0.5));
    }
    lampDirty = true;
  }
  const lamps = lampCenters.length;
  $('#count').textContent = HOME?.id === 'mulgyeol-maru'
    ? ({ko:'함께 쌓아가는 하루',en:'Little moments, shared',ja:'一緒に重ねる日々'}[lang] || '')
    : t('world.blocks', { n: blocks.size.toLocaleString(locale) }) + (lamps ? ` · ${t('world.lights', { n: lamps })}` : '');
  $('#empty').hidden = blocks.size > 0;
  invalidate();
}

// The album reuses saved public images. It never captures a screenshot or asks
// for a new image. Decode small wall textures lazily when this camera is opened.
let albumFiles = [], albumVersion = 0, albumKey = '';
const albumGroup = new THREE.Group(); scene.add(albumGroup);
async function refreshAlbum() {
  if (HOME?.id !== 'mulgyeol-maru' || cameraPreset !== 'album') return;
  const files = albumFiles.filter(f => f.available !== false && /^images\/[^/]+\.png$/i.test(f.path)
    && !f.path.includes('..') && f.size > 0 && f.size <= 8*1024*1024)
    .sort((a,b)=>(b.mtime||0)-(a.mtime||0)).slice(0,6);
  const key = files.map(f=>`${f.path}:${f.mtime}`).join('|');
  if (key === albumKey) return;
  albumKey = key; const version = ++albumVersion;
  for (const m of [...albumGroup.children]) {
    albumGroup.remove(m); m.geometry.dispose(); m.material.map?.dispose(); m.material.dispose();
  }
  for (const [i,f] of files.entries()) {
    try {
      const url = appUrl('/ws/'+f.path.split('/').map(encodeURIComponent).join('/')+`?t=${Math.round(f.mtime||0)}`);
      const response = await fetch(url); if (!response.ok) continue;
      const blob = await response.blob();
      const header = new DataView(await blob.slice(0,24).arrayBuffer());
      if (header.byteLength < 24 || header.getUint32(0) !== 0x89504e47 || header.getUint32(4) !== 0x0d0a1a0a) continue;
      const width = header.getUint32(16), height = header.getUint32(20);
      if (!width || !height || width > 16384 || height > 16384) continue;
      const scale = Math.min(236/width,354/height,1);
      const bitmap = await createImageBitmap(blob,{resizeWidth:Math.max(1,Math.round(width*scale)),resizeHeight:Math.max(1,Math.round(height*scale)),resizeQuality:'medium'});
      if (version !== albumVersion) { bitmap.close(); return; }
      const canvas = document.createElement('canvas'); canvas.width=256; canvas.height=384;
      const g=canvas.getContext('2d'); g.fillStyle='#fffaf0';g.fillRect(0,0,256,384);g.drawImage(bitmap,(256-bitmap.width)/2,(384-bitmap.height)/2);bitmap.close();
      const texture=new THREE.CanvasTexture(canvas);texture.colorSpace=THREE.SRGBColorSpace;
      const m=new THREE.Mesh(new THREE.PlaneGeometry(0.7,0.92),new THREE.MeshBasicMaterial({map:texture,side:THREE.DoubleSide}));
      m.position.set(36.995,5.5-Math.floor(i/3),21.5+(i%3));m.rotation.y=-Math.PI/2;
      albumGroup.add(m);invalidate();
    } catch { /* A missing public image leaves its physical frame empty. */ }
  }
}

// ---------- signs ----------
// A thin board in its cell, text on the side it faces (n = toward smaller z).
let SIGNS = {};
const signGroup = new THREE.Group();
scene.add(signGroup);
const SIGN_TURN = { s: 0, e: Math.PI / 2, n: Math.PI, w: -Math.PI / 2 };

function signTexture(s) {
  const W = 160 * s.width, H = 128;
  return canvasTexture(W, H, (g) => {
    g.fillStyle = s.bg; g.fillRect(0, 0, W, H);
    g.strokeStyle = 'rgba(0,0,0,.35)'; g.lineWidth = 8; g.strokeRect(4, 4, W - 8, H - 8);
    let size = 84;
    const font = (px) => `800 ${px}px ${FONT_STACK}`;
    g.font = font(size);
    while (size > 22 && g.measureText(s.text).width > W * 0.88) { size -= 4; g.font = font(size); }
    g.fillStyle = s.color; g.textAlign = 'center'; g.textBaseline = 'middle';
    if (s.glow) { g.shadowColor = s.color; g.shadowBlur = 18; }
    g.fillText(s.text, W / 2, H / 2 + 4);
  });
}

function renderSigns() {
  for (const m of [...signGroup.children]) {
    signGroup.remove(m);
    m.geometry.dispose();
    for (const mat of Array.isArray(m.material) ? m.material : [m.material]) { mat.map?.dispose(); mat.dispose(); }
  }
  const homeSigns = HOME?.id === 'mulgyeol-maru';
  const builtInLabels = new Map([
    ['12,7,16','아디나'], ['19,7,16','비앙카'], ['26,7,16','일레븐'], ['33,7,16','루치아'],
    ['23,6,37','물결마루'], ['10,6,16','북쪽 툇마루'], ['14,7,22','욕실·세탁'],
    ['37,7,24','사진과 추억'], ['36,6,25','나쟈의 작은 콘솔'], ['31,6,37','오늘의 식탁'], ['28,6,20','동백 중정'],
  ]);
  for (const [k, s] of Object.entries(SIGNS)) {
    const [x, y, z] = k.split(',').map(Number);
    if (homeSigns && builtInLabels.get(k) === s.text) continue;
    if (!homeVisible(x,y,z,HOME,cutaway,CUT)) continue;
    const tex = signTexture(s);
    tex.minFilter = THREE.LinearFilter; tex.magFilter = THREE.LinearFilter; // text reads better smooth
    if (homeSigns) {
      const width = Math.min(s.width, 2.4);
      const plaque = new THREE.Mesh(new THREE.PlaneGeometry(width, .42), new THREE.MeshBasicMaterial({map:tex,side:THREE.DoubleSide}));
      plaque.position.set(x+.5,y-.5,z+.5);
      plaque.rotation.y = SIGN_TURN[s.facing] ?? 0;
      signGroup.add(plaque);
      continue;
    }
    const front = s.glow
      ? new THREE.MeshBasicMaterial({ map: tex, color: new THREE.Color(2.4, 2.4, 2.4) })
      : lampLit(new THREE.MeshLambertMaterial({ map: tex }));
    const plain = lampLit(new THREE.MeshLambertMaterial({ color: new THREE.Color(s.bg) }));
    const board = new THREE.Mesh(new THREE.BoxGeometry(s.width * 0.98, 0.8, 0.08), [plain, plain, plain, plain, front, plain]);
    board.position.set(x + 0.5, y - 0.5, z + 0.5);
    board.rotation.y = SIGN_TURN[s.facing] ?? 0;
    signGroup.add(board);
  }
}

// ---------- avatars, name tags, speech bubbles ----------
const avatars = {}; // id -> {group, target, bubble, bubbleUntil}
let avatarPositions = {};
const portraitGeometry = new THREE.PlaneGeometry(1, 1);
const contactGeometry = new THREE.CircleGeometry(0.55, 24);

function circleTexture(img, ring, id) {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const g = c.getContext('2d');
  g.beginPath(); g.arc(64, 64, 60, 0, Math.PI * 2); g.closePath();
  g.save(); g.clip();
  g.fillStyle = '#e8e6ef'; g.fillRect(0, 0, 128, 128);
  if (img) drawAvatar(g, img, id, 0, 0, 128, 128);
  g.restore();
  g.lineWidth = 6; g.strokeStyle = ring; g.stroke();
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function textSprite(text, { color = '#1b1f2a', bg = 'rgba(255,255,255,.94)', border = 'rgba(0,0,0,.15)', size = 30, maxW = 520, tail = false } = {}) {
  const c = document.createElement('canvas');
  const g = c.getContext('2d');
  const font = `600 ${size}px ${FONT_STACK}`;
  g.font = font;
  const words = [...String(text)];
  const lines = [];
  let cur = '';
  for (const ch of words) {
    if (g.measureText(cur + ch).width > maxW && cur) { lines.push(cur); cur = ch.trimStart(); } else cur += ch;
    if (lines.length >= 4) break;
  }
  if (lines.length < 4 && cur) lines.push(cur);
  if (lines.length === 4 && words.length > lines.join('').length) lines[3] = lines[3].slice(0, -1) + '…';
  const w = Math.min(maxW, Math.max(...lines.map((l) => g.measureText(l).width))) + size * 1.2;
  const lh = size * 1.3;
  const h = lines.length * lh + size * 0.8 + (tail ? size * 0.6 : 0);
  c.width = Math.ceil(w); c.height = Math.ceil(h);
  g.font = font;
  const bh = h - (tail ? size * 0.6 : 0);
  g.fillStyle = bg; g.strokeStyle = border; g.lineWidth = 3;
  const r = Math.min(24, bh / 2);
  g.beginPath(); g.roundRect(2, 2, c.width - 4, bh - 4, r);
  if (tail) { g.moveTo(c.width / 2 - 14, bh - 3); g.lineTo(c.width / 2, h - 2); g.lineTo(c.width / 2 + 14, bh - 3); }
  g.fill(); g.stroke();
  g.fillStyle = color; g.textBaseline = 'middle'; g.textAlign = 'center';
  lines.forEach((l, i) => g.fillText(l, c.width / 2, size * 0.4 + lh * (i + 0.5)));
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false }));
  const k = tail ? 70 : 110; // speech bubbles bigger than name tags so they read from afar
  sp.scale.set(c.width / k, c.height / k, 1);
  sp.renderOrder = 10;
  return sp;
}

function ensureAvatar(id) {
  if (avatars[id]) { refreshAvatar(id); return avatars[id]; }
  if (!MEMBERS[id] && !['dev', 'former-member'].includes(id)) return;
  const group = new THREE.Group();
  // One shared portrait plane: camera-facing while upright, physically horizontal
  // on a bed. Reuses the same draw/geometry when posture changes.
  const face = new THREE.Mesh(portraitGeometry, new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, depthWrite: false }));
  face.scale.set(1.8, 1.8, 1);
  face.position.y = 1.1;
  group.add(face);
  const shadow = new THREE.Mesh(contactGeometry, new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.22 }));
  shadow.rotation.x = -Math.PI / 2;
  shadow.position.y = 0.02;
  group.add(shadow);
  scene.add(group);
  avatars[id] = { group, face, shadow, tag: null, target: new THREE.Vector3(), bubble: null, bubbleUntil: 0, posture: 'stand' };
  refreshAvatar(id);
  return avatars[id];
}

function refreshAvatar(id) {
  const a = avatars[id], color = memberColor(id) || '#555b66';
  const accent = memberAccentColor(id) || color;
  const key = JSON.stringify([NAME_OF(id), color, accent, avatarSpec(id)]);
  if (a.identity === key) return;
  a.identity = key;
  if (a.tag) { a.group.remove(a.tag); a.tag.material.map.dispose(); a.tag.material.dispose(); }
  a.tag = textSprite(NAME_OF(id), { color: '#fff', bg: color, border: accent, size: 26 });
  a.tag.position.y = a.tagY ?? 2.35; a.group.add(a.tag);
  a.face.material.map?.dispose();
  a.face.material.map = circleTexture(null, accent, id);
  a.face.material.needsUpdate = true;
  a.faceReady = loadAvatarImage(id).then((img) => {
    if (!img || a.identity !== key) return;
    a.face.material.map?.dispose();
    a.face.material.map = circleTexture(img, accent, id);
    a.face.material.needsUpdate = true;
    invalidate();
  });
}

function poseAvatar(a, p) {
  const posture = ['sit', 'lie', 'work'].includes(p.posture) ? p.posture : 'stand';
  a.posture = posture;
  const lying = posture === 'lie', sitting = posture === 'sit', working = posture === 'work';
  a.face.scale.set(lying ? 0.76 : sitting ? 1.05 : working ? 1.55 : 1.8, lying ? 0.9 : sitting ? 1.05 : working ? 1.55 : 1.8, 1);
  a.face.position.y = lying ? 0.09 : sitting ? 0.58 : working ? 0.96 : 1.1;
  if (lying) a.face.rotation.set(-Math.PI / 2, 0, Math.PI + (FACING_TURN[p.facing] || 0));
  a.tagY = lying ? 0.98 : sitting ? 1.35 : working ? 2.05 : 2.35;
  a.tag.position.y = a.tagY;
  a.shadow.scale.set(lying ? 0.72 : sitting ? 0.6 : 1, lying ? 0.55 : sitting ? 0.6 : 1, 1);
  if (a.bubble) a.bubble.position.y = a.tagY + 0.85 + a.bubble.scale.y / 2;
}
function setAvatars(map) {
  avatarPositions = { ...avatarPositions, ...map };
  for (const [id, p] of Object.entries(map || {})) {
    const a = ensureAvatar(id);
    if (!a) continue;
    a.target.set(p.x + 0.5, (p.y ?? 1) - 1, p.z + 0.5); // server resolves floor or seat/mattress surface
    a.finalPose = p;
    if (!a.placed || document.hidden || SHOT) {
      a.group.position.copy(a.target); a.placed = true; a.route = []; a.moveId = p.moveId;
    } else if (p.moveId !== undefined && p.moveId !== a.moveId) {
      const route = safeRoute(p.path).map(v => new THREE.Vector3(v.x + 0.5, v.y - 1, v.z + 0.5));
      // A new command starts at the server's previous destination. Finish the
      // existing route before taking it, rather than cutting across a wall.
      if (route.length) {
        const old = a.route || [];
        const end = old.at(-1) || a.group.position;
        if (end.distanceToSquared(route[0]) < 0.02) a.route = [...old, ...route.slice(1)];
        else { a.group.position.copy(route[0]); a.route = route.slice(1); }
      } else { a.group.position.copy(a.target); a.route = []; }
      a.moveId = p.moveId;
    } else if (p.moveId === undefined) { a.route = []; a.group.position.copy(a.target); }
    poseAvatar(a, a.route?.length ? { posture:'stand' } : p);
  }
  invalidate();
}

function say(id, text) {
  const a = avatars[id];
  if (!a || !text) return;
  if (a.bubble) { a.group.remove(a.bubble); a.bubble.material.map.dispose(); a.bubble.material.dispose(); }
  a.bubble = textSprite(text, { tail: true });
  a.bubble.position.y = a.tagY + 0.85 + a.bubble.scale.y / 2;
  a.group.add(a.bubble);
  a.bubbleUntil = performance.now() + Math.min(14000, 5000 + text.length * 120);
  clearTimeout(a.bubbleTimer);
  a.bubbleTimer = setTimeout(invalidate, a.bubbleUntil - performance.now() + 1);
  invalidate();
}

// ---------- HUD ----------
let follow = null;
function renderWho() {
  const box = $('#who');
  box.innerHTML = '';
  for (const [id, m] of Object.entries(MEMBERS)) {
    const b = document.createElement('button');
    b.type = 'button';
    const name = document.createElement('span');
    name.style.color = memberColor(id); name.style.fontWeight = '650'; name.textContent = m.name;
    const avatar = createAvatar(id);
    avatar.style.outline = `2px solid ${memberAccentColor(id) || memberColor(id) || '#555b66'}`;
    avatar.style.outlineOffset = '-1px';
    b.append(avatar, name);
    b.onclick = () => { follow = follow === id ? null : id; b.classList.toggle('on', follow === id); renderWhoState(); invalidate(); };
    b.dataset.id = id;
    box.append(b);
  }
  renderWhoState();
}
function renderWhoState() { for (const b of $('#who').children) b.classList.toggle('on', b.dataset.id === follow); }

const chatLines = [];
function addChat(m) {
  if (!m || m.kind === 'react') return;
  let text = m.text || '';
  if (!text && m.attach) text = t(m.attach.sticker ? 'world.sticker' : 'world.picture');
  if (!text) return;
  chatLines.push({ from: m.from, text, sys: m.from === 'system' });
  while (chatLines.length > 7) chatLines.shift();
  renderChat();
}
function renderChat() {
  const box = $('#chat');
  box.hidden = !chatLines.length;
  box.innerHTML = '';
  for (const l of chatLines) {
    const d = document.createElement('div');
    d.className = `l${l.sys ? ' sys' : ''}`;
    if (!l.sys) {
      const n = document.createElement('span');
      n.className = 'n';
      n.style.color = memberColor(l.from) || 'var(--accent)';
      n.textContent = NAME_OF(l.from);
      d.append(n);
    }
    d.append(document.createTextNode(l.text.length > 160 ? l.text.slice(0, 160) + '…' : l.text));
    box.append(d);
  }
}

function stopCameraInertia() {
  const damping = controls.enableDamping;
  controls.enableDamping = false; controls.update(); controls.enableDamping = damping;
}
$('#rotate').onclick = (e) => {
  controls.autoRotate = !controls.autoRotate;
  if (!controls.autoRotate) stopCameraInertia();
  e.currentTarget.classList.toggle('on', controls.autoRotate); invalidate();
};
$('#night').onclick = () => {
  night = !night;
  try { localStorage.setItem('world-night', night ? '1' : '0'); } catch { /* no storage */ }
  applyNight();
};

// Signal the headless camera once the world and the faces are in and a few frames ran.
async function markShotReady() {
  // A free camera standing next to a member would shoot the back of that face up close.
  // Measured from the middle of face + name tag (feet + 1.6), not the feet.
  if (freeCam) {
    for (const a of Object.values(avatars)) {
      if (a.target.clone().add(new THREE.Vector3(0, 1.6, 0)).distanceTo(camera.position) < 2.6) a.group.visible = false;
    }
  }
  const imgs = Object.values(avatars).map((a) => a.faceReady).filter(Boolean);
  await Promise.race([Promise.all(imgs), new Promise((r) => setTimeout(r, 4000))]);
  let frames = 0;
  await new Promise((r) => { const f = () => (++frames >= 12 ? r() : requestAnimationFrame(f)); requestAnimationFrame(f); });
  window.__shotReady = true;
}
$('#home').onclick = () => { homeView(); renderWhoState(); };

// ---------- data ----------
function setMembers(list = []) {
  const changed = setPersonaMembers(list);
  MEMBERS = Object.fromEntries(list.map((m) => [m.id, m]));
  livingView.setMembers(list);
  if (!changed) return;
  renderWho();
  setAvatars(avatarPositions);
  for (const id of Object.keys(avatars)) refreshAvatar(id);
  renderChat();
}
async function load() {
  const [w, st] = await Promise.all([
    fetch(appUrl('/api/world'), { cache: 'no-store' }).then((r) => r.json()),
    fetch(appUrl('/api/state'), { cache: 'no-store' }).then((r) => r.json()),
    livingView.reload(),
  ]);
  USER_NAME = st.room?.userName || USER_NAME;
  setMembers(st.members);
  SIZE = w.size; PALETTE = w.palette; CUSTOM = w.custom || {};
  const previousHomeId = HOME?.id;
  HOME = w.home || null;
  dioramaDirty = true;
  applyNight();
  albumFiles = st.files || [];
  renderHomeControls();
  invalidateMaterials(new Set([...texCache.keys(), ...matCache.keys()]));
  blocks.clear();
  for (const [x, y, z, type] of w.blocks) blocks.set(`${x},${y},${z}`, type);
  buildGround();
  rebuild(new Set([...blocks.values(), ...meshes.keys(), 'lamp']));
  SIGNS = w.signs || {};
  renderSigns();
  setAvatars(w.avatars);
  chatLines.length = 0;
  for (const m of (st?.messages || []).slice(-6)) addChat(m);
  if (!SHOT && (!loadedOnce || previousHomeId !== HOME?.id)) homeView();
  loadedOnce = true;
  refreshAlbum();
}

function connect() {
  const es = new EventSource(appUrl('/events'));
  es.addEventListener('living', (e) => {
    try { livingView.setState(JSON.parse(e.data)); } catch { /* wait for the next public snapshot */ }
  });
  es.addEventListener('members', (e) => setMembers(JSON.parse(e.data)));
  es.addEventListener('room', (e) => { USER_NAME = JSON.parse(e.data).userName || USER_NAME; renderChat(); });
  es.addEventListener('ws', (e) => { albumFiles = JSON.parse(e.data) || []; refreshAlbum(); });
  es.addEventListener('world', (e) => {
    const { changes } = JSON.parse(e.data);
    const types = new Set();
    for (const [x, y, z, type] of changes) {
      const k = `${x},${y},${z}`;
      const old = blocks.get(k);
      if (old) types.add(old);
      if (type) { blocks.set(k, type); types.add(type); } else blocks.delete(k);
      for (const [dx,dy,dz] of NEIGHBORS) {
        const neighbor = blocks.get(`${x+dx},${y+dy},${z+dz}`); if (neighbor) types.add(neighbor);
      }
    }
    if (changes.length) dioramaDirty = true;
    rebuild(types);
  });
  es.addEventListener('avatars', (e) => setAvatars(JSON.parse(e.data)));
  es.addEventListener('signs', (e) => { SIGNS = JSON.parse(e.data) || {}; renderSigns(); invalidate(); });
  es.addEventListener('worldblocks', (e) => {
    const previous = Object.keys(CUSTOM);
    CUSTOM = JSON.parse(e.data) || {};
    const changed = new Set([...previous, ...Object.keys(CUSTOM)]);
    invalidateMaterials(changed);
    rebuild(new Set([...blocks.values()].filter((v) => changed.has(parseBlock(v).type))));
  });
  es.addEventListener('msg', (e) => {
    const m = JSON.parse(e.data);
    addChat(m);
    if (MEMBERS[m.from] && m.text) say(m.from, m.text);
  });
  let hadError = false;
  es.onerror = () => { hadError = true; livingView.setDisconnected(); };
  es.onopen = () => { if (hadError) { hadError = false; load().catch(() => {}); } };
}

// ---------- loop ----------
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  if (HOME?.id === 'mulgyeol-maru' && !SHOT && !follow && !freeCam) selectCamera(cameraPreset);
  invalidate();
}
addEventListener('resize', resize);
resize();

// Read-only diagnostics; dormant views render no frames at all.
renderer.info.autoReset = false;
window.__worldRenderStats = () => ({
  blocks: blocks.size, batches: meshes.size,
  blockDrawCalls: [...meshes.values()].reduce((n, m) => n + (Array.isArray(m.material) ? m.geometry.groups.length : 1), 0),
  blockTriangles: [...meshes.values()].reduce((n, m) => n + (m.geometry.index?.count ?? m.geometry.attributes.position.count) / 3 * m.count, 0),
  geometries: renderer.info.memory.geometries, textures: renderer.info.memory.textures,
  cachedGeometries: new Set(geoCache.values()).size, cachedMaterials: matCache.size, cachedTextures: texCache.size,
  calls: renderer.info.render.calls, triangles: renderer.info.render.triangles,
  lights: scene.children.filter((o) => o.isLight).length, passes: 1,
  renderedFrames, visible: !document.hidden, maxFps: 30, pixelRatio: renderer.getPixelRatio(),
  visibleInstances: diorama ? diorama.stats().visibleInstances : [...meshes.values()].reduce((n,m)=>n+m.count,0),
  renderCpuMs: frameTimes.length ? frameTimes.reduce((a,b)=>a+b,0)/frameTimes.length : null,
  camera: cameraPreset, cutaway,
  style: diorama ? 'diorama' : 'blocks', diorama: diorama?.stats() || null,
  living: livingView.stats(),
  visibleSigns: signGroup.children.length,
  actors: Object.fromEntries(Object.entries(avatars).map(([id,a])=>[id,{position:a.group.position.toArray(),remaining:a.route?.length||0,posture:a.posture}])),
});
const followPoint = new THREE.Vector3();
function invalidate() {
  needsRender = true;
  if (!document.hidden && pendingFrame === null) pendingFrame = requestAnimationFrame(tick);
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    if (pendingFrame !== null) cancelAnimationFrame(pendingFrame);
    pendingFrame = null;
  } else {
    for (const a of Object.values(avatars)) {
      a.route = []; a.group.position.copy(a.target); poseAvatar(a,a.finalPose || {});
    }
    lastTickAt = 0; invalidate();
  }
});
function tick(now) {
  pendingFrame = null;
  if (document.hidden) return;
  if (now - lastFrameAt < 1000/30 - 1) { invalidate(); return; }
  lastFrameAt = now;
  const dt = Math.min(0.1, lastTickAt ? (now-lastTickAt)/1000 : 1/30); lastTickAt = now;
  let active = controls.autoRotate;
  if (follow && avatars[follow]) {
    const p = avatars[follow].group.position;
    followPoint.set(p.x,p.y+1,p.z);
    if (controls.target.distanceToSquared(followPoint) > 0.0001) {
      controls.target.lerp(followPoint,0.2); active = true;
    }
  }
  if (!freeCam && controls.update()) active = true;
  for (const a of Object.values(avatars)) {
    if (a.route?.length) {
      const next = a.route[0], distance = a.group.position.distanceTo(next), step = dt*4;
      if (distance <= step) { a.group.position.copy(next); a.route.shift(); }
      else a.group.position.lerp(next,step/distance);
      active = true;
      if (!a.route.length) { a.group.position.copy(a.target); poseAvatar(a,a.finalPose); }
    }
    if (a.posture !== 'lie') { a.face.quaternion.copy(camera.quaternion); if (a.posture === 'work') a.face.rotateZ(-0.1); }
    if (a.bubble && now > a.bubbleUntil) {
      const left = 1 - (now - a.bubbleUntil) / 800;
      if (left <= 0) { a.group.remove(a.bubble); a.bubble.material.map.dispose(); a.bubble.material.dispose(); a.bubble = null; }
      else { a.bubble.material.opacity = left; active = true; }
    }
  }
  LAMP.uTime.value = now / 1000;
  updateLamps();
  renderer.info.reset();
  const start = performance.now();
  renderer.render(scene,camera); renderedFrames++;
  frameTimes.push(performance.now()-start); if (frameTimes.length>180) frameTimes.shift();
  needsRender = false;
  if (active) invalidate();
}

renderWho();
applyNight();
homeView();
load()
  .then(() => { if (SHOT) { shotView(); markShotReady(); } })
  .catch(() => { $('#empty').hidden = false; $('#empty').textContent = t('world.loadFailed'); });
if (!SHOT) connect();
invalidate();
</script>
</body>
</html>
